services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # network_mode host: necessario perche' mDNS/zeroconf usa multicast UDP
    # e sulla rete bridge di default di Docker il traffico multicast della LAN
    # non arriva dentro al container. Funziona su host Linux (es. Raspberry Pi,
    # mini PC, NAS con Docker) - non su Docker Desktop per Mac/Windows.
    # network_mode: host

    environment:
      POSTGRES_DB: homepilot
      POSTGRES_USER: homepilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data

  server:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: postgresql+psycopg2://homepilot:${DB_PASSWORD:-changeme}@db:5432/homepilot

volumes:
  db_data:
